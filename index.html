<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swedish Flashcards</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Svenska">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121821" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4e79'/%3E%3Ctext x='32' y='43' font-family='Helvetica,Arial,sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='%23f2c94c'%3ESv%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchIcon" href="">
<style>
  /* ---------- Colors (light) ---------- */
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #eef2f6;
    --text: #1d2733;
    --muted: #65727f;
    --blue: #1f4e79;
    --blue-soft: #dde8f3;
    --yellow: #f2c94c;
    --yellow-soft: #fdf3d3;
    --good: #2f9e6e;
    --good-soft: #dff3ea;
    --bad: #d0574f;
    --bad-soft: #fbe3e1;
    --border: #dfe4ea;
    --shadow: 0 10px 30px rgba(31, 78, 121, 0.10), 0 2px 6px rgba(31, 78, 121, 0.06);
  }
  /* ---------- Colors (dark) ---------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121821;
      --surface: #1b2430;
      --surface-2: #232e3c;
      --text: #e8edf2;
      --muted: #9aa7b4;
      --blue: #7fb2e5;
      --blue-soft: #22364c;
      --yellow: #f2c94c;
      --yellow-soft: #3a3320;
      --good: #4cc08c;
      --good-soft: #1d3a2e;
      --bad: #ef7d74;
      --bad-soft: #432826;
      --border: #2e3a48;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.25);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
  }

  /* ---------- Header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; background: var(--blue);
    display: grid; place-items: center; color: #f2c94c; font-weight: 800; font-size: 19px;
    position: relative; overflow: hidden;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo { background: #1f4e79; } }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .dir-btn {
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
    padding: 12px 18px; min-height: 48px; font-weight: 600; font-size: 16px;
    display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow);
  }
  .dir-btn .arrow { color: var(--blue); }

  /* ---------- Tabs ---------- */
  .tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    background: var(--surface-2); padding: 6px; border-radius: 16px; margin-bottom: 16px;
  }
  .tab {
    border: 0; background: transparent; border-radius: 12px; min-height: 52px;
    font-size: 17px; font-weight: 600; color: var(--muted); position: relative;
    transition: background .2s, color .2s;
  }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 30%; right: 30%; bottom: 7px; height: 3px;
    border-radius: 3px; background: var(--yellow);
  }

  /* ---------- Session bar ---------- */
  .session { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; margin-bottom: 18px; }
  .session-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; font-size: 16px; }
  .score { font-weight: 700; font-size: 18px; }
  .score small { color: var(--muted); font-weight: 500; font-size: 15px; }
  .count { color: var(--muted); }
  .bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--yellow)); border-radius: 99px; transition: width .4s ease; }
  .session-tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--yellow-soft); color: var(--text); margin-left: 6px; vertical-align: middle; }

  /* ---------- Shared buttons ---------- */
  .btn {
    border: 0; border-radius: 16px; min-height: 60px; padding: 0 22px;
    font-size: 19px; font-weight: 700; background: var(--surface-2); color: var(--text);
    transition: transform .1s, background .2s, opacity .2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--blue); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: #2c6aa3; } }
  .btn.good { background: var(--good-soft); color: var(--good); }
  .btn.bad { background: var(--bad-soft); color: var(--bad); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ---------- Swipe card ---------- */
  .stage { position: relative; height: min(56vh, 440px); min-height: 300px; margin-bottom: 18px; perspective: 1400px; }
  .card {
    position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none;
    will-change: transform; cursor: grab;
  }
  .card.animate { transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  .card-inner {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.3,.7,.2,1);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 26px; background: var(--surface);
    border: 1px solid var(--border); box-shadow: var(--shadow);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px; text-align: center; overflow: hidden;
  }
  .face::before { /* thin blue + yellow stripe at the top: the Swedish touch */
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, var(--blue) 0 72%, var(--yellow) 72% 100%);
  }
  .back { transform: rotateY(180deg); }
  .lang { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .word { font-size: clamp(44px, 9vw, 72px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; word-break: break-word; }
  .answer { font-size: clamp(34px, 6.5vw, 52px); font-weight: 800; color: var(--blue); line-height: 1.1; }
  .answer-sub { font-size: 18px; color: var(--muted); margin-top: 6px; }
  .example { margin-top: 22px; padding: 14px 18px; background: var(--surface-2); border-radius: 16px; max-width: 100%; }
  .example .sv { font-size: 21px; font-weight: 600; }
  .example .en { font-size: 17px; color: var(--muted); margin-top: 4px; }
  .hint { position: absolute; bottom: 18px; left: 0; right: 0; font-size: 15px; color: var(--muted); }
  .tint {
    position: absolute; inset: 0; border-radius: 26px; pointer-events: none; opacity: 0;
    display: flex; align-items: flex-start; padding: 26px; font-size: 22px; font-weight: 800; z-index: 3;
  }
  .tint.good { background: rgba(47,158,110,.22); color: var(--good); justify-content: flex-start; border: 3px solid var(--good); }
  .tint.bad { background: rgba(208,87,79,.22); color: var(--bad); justify-content: flex-end; border: 3px solid var(--bad); }
  .stage .peek { /* the card waiting underneath */
    position: absolute; inset: 0; border-radius: 26px; background: var(--surface);
    border: 1px solid var(--border); transform: translateY(10px) scale(.96); opacity: .7;
  }

  /* ---------- Multiple choice & typing ---------- */
  .prompt-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 26px; box-shadow: var(--shadow);
    padding: 34px 24px; text-align: center; margin-bottom: 18px; position: relative; overflow: hidden;
  }
  .prompt-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, var(--blue) 0 72%, var(--yellow) 72% 100%);
  }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .option {
    border: 2px solid var(--border); background: var(--surface); border-radius: 18px;
    min-height: 84px; padding: 12px 16px; font-size: 21px; font-weight: 600; line-height: 1.25;
    transition: background .2s, border-color .2s, transform .1s;
  }
  .option:active { transform: scale(.98); }
  .option.correct { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .option.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .option:disabled { cursor: default; }
  .type-input {
    width: 100%; font-size: 28px; font-weight: 600; text-align: center; padding: 18px; border-radius: 18px;
    border: 2px solid var(--border); background: var(--surface); color: var(--text); outline: none;
    transition: border-color .2s, background .2s;
  }
  .type-input:focus { border-color: var(--blue); }
  .type-input.correct { border-color: var(--good); background: var(--good-soft); }
  .type-input.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .letters { display: flex; justify-content: center; gap: 12px; margin: 14px 0; }
  .letter { width: 72px; height: 60px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); font-size: 26px; font-weight: 700; }
  .letter:active { background: var(--yellow-soft); }
  .feedback { min-height: 30px; text-align: center; font-size: 20px; font-weight: 700; margin: 6px 0 12px; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .feedback .ex { display: block; font-weight: 500; font-size: 17px; color: var(--muted); margin-top: 6px; }

  /* ---------- Done screen ---------- */
  .done { text-align: center; padding: 40px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 26px; box-shadow: var(--shadow); }
  .done .big { font-size: 64px; font-weight: 800; color: var(--blue); margin: 10px 0; }
  .done p { color: var(--muted); font-size: 18px; margin: 0 0 22px; }
  .done .row { max-width: 460px; margin: 0 auto; }

  /* ---------- Footer controls ---------- */
  .footer { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .footer .btn { font-size: 17px; min-height: 56px; }
  .footer .btn.wide { grid-column: 1 / -1; }
  .reset { background: transparent; border: 1px solid var(--border); color: var(--muted); }

  @media (max-width: 520px) {
    .options { grid-template-columns: 1fr; }
    .option { min-height: 64px; }
    h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card-inner, .card.animate, .bar > div { transition-duration: .01s; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">Sv</div>
      <div>
        <h1>Swedish Flashcards</h1>
        <div class="subtitle">Lär dig svenska, ett ord i taget</div>
      </div>
    </div>
    <button class="dir-btn" id="dirBtn" aria-label="Switch direction"></button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-mode="swipe">Swipe Cards</button>
    <button class="tab" role="tab" data-mode="choice">Multiple Choice</button>
    <button class="tab" role="tab" data-mode="type">Typing</button>
  </nav>

  <section class="session">
    <div class="session-top">
      <div class="score" id="score"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="bar"><div id="barFill"></div></div>
  </section>

  <main id="main"></main>

  <div class="footer">
    <button class="btn" id="newBtn">New session</button>
    <button class="btn" id="weakBtn">Practice my weak words</button>
    <button class="btn reset wide" id="resetBtn">Reset progress</button>
  </div>
</div>

<script>
/* =====================================================================
   YOUR WORD LIST
   ---------------------------------------------------------------------
   Every word is one line inside the [ ... ] brackets below.

   HOW TO ADD A NEW WORD:
   1. Copy any line, for example:
        { sv: "hej", en: "hi / hello", exSv: "Hej! Hur mår du?", exEn: "Hi! How are you?" },
   2. Paste it on a new line just before the closing  ];
   3. Change the four texts:
        sv   = the Swedish word
        en   = the English meaning (use " / " between different meanings,
               any of them will count as correct when you type)
        exSv = an example sentence in Swedish
        exEn = the English translation of that sentence
   4. Keep the quotes "..." and the comma at the end of the line.
   ===================================================================== */
const WORDS = [
  { sv: "jag",     en: "I",                       exSv: "Jag heter Anna.",                exEn: "My name is Anna." },
  { sv: "du",      en: "you",                     exSv: "Du är snäll.",                   exEn: "You are kind." },
  { sv: "han",     en: "he",                      exSv: "Han bor i Stockholm.",           exEn: "He lives in Stockholm." },
  { sv: "hon",     en: "she",                     exSv: "Hon läser en bok.",              exEn: "She is reading a book." },
  { sv: "vi",      en: "we",                      exSv: "Vi äter middag nu.",             exEn: "We are eating dinner now." },
  { sv: "de",      en: "they",                    exSv: "De kommer i morgon.",            exEn: "They are coming tomorrow." },
  { sv: "det",     en: "it / that",               exSv: "Det är kallt i dag.",            exEn: "It is cold today." },
  { sv: "en",      en: "a / an (en-words)",       exSv: "Jag har en katt.",               exEn: "I have a cat." },
  { sv: "ett",     en: "a / an (ett-words)",      exSv: "Vi har ett hus.",                exEn: "We have a house." },
  { sv: "och",     en: "and",                     exSv: "Kaffe och kaka, tack.",          exEn: "Coffee and cake, please." },
  { sv: "är",      en: "is / am / are",           exSv: "Jag är trött.",                  exEn: "I am tired." },
  { sv: "inte",    en: "not",                     exSv: "Jag förstår inte.",              exEn: "I don't understand." },
  { sv: "ja",      en: "yes",                     exSv: "Ja, det stämmer.",               exEn: "Yes, that's right." },
  { sv: "nej",     en: "no",                      exSv: "Nej, tack.",                     exEn: "No, thank you." },
  { sv: "hej",     en: "hi / hello",              exSv: "Hej! Hur mår du?",               exEn: "Hi! How are you?" },
  { sv: "tack",    en: "thanks / thank you",      exSv: "Tack för hjälpen!",              exEn: "Thanks for the help!" },
  { sv: "hej då",  en: "goodbye / bye",           exSv: "Hej då, vi ses!",                exEn: "Bye, see you!" },
  { sv: "vad",     en: "what",                    exSv: "Vad heter du?",                  exEn: "What is your name?" },
  { sv: "var",     en: "where",                   exSv: "Var bor du?",                    exEn: "Where do you live?" },
  { sv: "vem",     en: "who",                     exSv: "Vem är det?",                    exEn: "Who is that?" },
  { sv: "när",     en: "when",                    exSv: "När börjar filmen?",             exEn: "When does the movie start?" },
  { sv: "hur",     en: "how",                     exSv: "Hur mycket kostar det?",         exEn: "How much does it cost?" },
  { sv: "varför",  en: "why",                     exSv: "Varför är du ledsen?",           exEn: "Why are you sad?" },
  { sv: "har",     en: "have / has",              exSv: "Jag har en bror.",               exEn: "I have a brother." },
  { sv: "kan",     en: "can",                     exSv: "Kan du hjälpa mig?",             exEn: "Can you help me?" },
  { sv: "vill",    en: "want / want to",          exSv: "Jag vill ha kaffe.",             exEn: "I want coffee." },
  { sv: "ska",     en: "will / shall / going to", exSv: "Vi ska åka hem.",                exEn: "We are going to go home." },
  { sv: "bra",     en: "good / well / fine",      exSv: "Jag mår bra.",                   exEn: "I'm feeling fine." },
  { sv: "dålig",   en: "bad",                     exSv: "Jag har en dålig dag.",          exEn: "I'm having a bad day." },
  { sv: "stor",    en: "big / large",             exSv: "Det är en stor hund.",           exEn: "It's a big dog." },
  { sv: "liten",   en: "small / little",          exSv: "Hon har en liten katt.",         exEn: "She has a small cat." },
  { sv: "mycket",  en: "much / a lot / very",     exSv: "Tack så mycket!",                exEn: "Thank you very much!" },
  { sv: "lite",    en: "a little / a bit",        exSv: "Jag talar lite svenska.",        exEn: "I speak a little Swedish." },
  { sv: "här",     en: "here",                    exSv: "Jag bor här.",                   exEn: "I live here." },
  { sv: "där",     en: "there",                   exSv: "Bussen står där borta.",         exEn: "The bus is over there." },
  { sv: "nu",      en: "now",                     exSv: "Vi går nu.",                     exEn: "We are leaving now." },
  { sv: "i dag",   en: "today",                   exSv: "Vad gör du i dag?",              exEn: "What are you doing today?" },
  { sv: "i morgon",en: "tomorrow",                exSv: "Vi ses i morgon!",               exEn: "See you tomorrow!" },
  { sv: "med",     en: "with",                    exSv: "Jag går med dig.",               exEn: "I'll go with you." },
  { sv: "på",      en: "on / at",                 exSv: "Boken ligger på bordet.",        exEn: "The book is on the table." },
  { sv: "till",    en: "to",                      exSv: "Jag åker till Göteborg.",        exEn: "I'm going to Gothenburg." },
  { sv: "från",    en: "from",                    exSv: "Jag kommer från England.",       exEn: "I come from England." },
  { sv: "för",     en: "for",                     exSv: "Tack för maten!",                exEn: "Thanks for the food!" },
  { sv: "men",     en: "but",                     exSv: "Jag är trött, men glad.",        exEn: "I'm tired, but happy." },
  { sv: "eller",   en: "or",                      exSv: "Te eller kaffe?",                exEn: "Tea or coffee?" },
  { sv: "också",   en: "also / too",              exSv: "Jag vill också åka.",            exEn: "I also want to go." },
  { sv: "kanske",  en: "maybe / perhaps",         exSv: "Kanske i morgon.",               exEn: "Maybe tomorrow." },
  { sv: "gärna",   en: "gladly / happily",        exSv: "Ja, gärna!",                     exEn: "Yes, I'd love to!" },
  { sv: "ursäkta", en: "excuse me",               exSv: "Ursäkta, var är stationen?",     exEn: "Excuse me, where is the station?" },
  { sv: "förlåt",  en: "sorry",                   exSv: "Förlåt, jag är sen.",            exEn: "Sorry, I'm late." },
];

/* How many cards in one normal session (weak-word sessions use all weak words). */
const SESSION_SIZE = 20;

/* ===================== Saved progress (localStorage) ===================== */
const STORE_KEY = "svFlash.v1";
let memoryStore = null; // used if the browser blocks localStorage

function loadData() {
  let data = null;
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) { data = memoryStore; }
  if (!data || typeof data !== "object") data = {};
  if (!data.wrong || typeof data.wrong !== "object") data.wrong = {};
  if (typeof data.reverse !== "boolean") data.reverse = false;
  if (!["swipe", "choice", "type"].includes(data.mode)) data.mode = "swipe";
  return data;
}
function saveData() {
  memoryStore = store;
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignore */ }
}
let store = loadData();

function markResult(word, correct) {
  const n = store.wrong[word.sv] || 0;
  if (correct) {
    if (n > 1) store.wrong[word.sv] = n - 1; else delete store.wrong[word.sv];
  } else {
    store.wrong[word.sv] = n + 1;
  }
  saveData();
}
function weakWords() { return WORDS.filter(w => store.wrong[w.sv] > 0); }

/* ===================== Helpers ===================== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
// Makes answers easy to compare: lower case, no extra spaces, no end punctuation.
function normalize(s) {
  return String(s).toLowerCase().replace(/\([^)]*\)/g, " ").replace(/[.,!?;:"]/g, " ")
    .replace(/\s+/g, " ").trim();
}
// "hi / hello" -> ["hi", "hello"]
function alternatives(s) {
  return String(s).split("/").map(normalize).filter(Boolean);
}

/* Direction: "showSv" = the Swedish word is shown and you answer in English.
   Typing is the other way round by default (show English, type Swedish),
   so the Swap button flips it for every mode. */
function showSwedish() {
  return session.mode === "type" ? store.reverse : !store.reverse;
}
function promptOf(w) { return showSwedish() ? w.sv : w.en; }
function answerOf(w) { return showSwedish() ? w.en : w.sv; }
function promptLang() { return showSwedish() ? "Svenska" : "English"; }
function answerLang() { return showSwedish() ? "English" : "Svenska"; }

/* ===================== Session state ===================== */
const session = {
  mode: store.mode,
  source: "all",   // "all" or "weak"
  words: [],       // the words in this session
  queue: [],       // words still to go
  correct: 0,
  answered: 0,
  finished: 0,     // how many words are done (for the progress bar)
  busy: false,
};

function startSession(source) {
  session.source = source || "all";
  const pool = session.source === "weak" ? weakWords() : WORDS;
  const list = shuffle(pool);
  session.words = session.source === "weak" ? list : list.slice(0, SESSION_SIZE);
  session.queue = session.words.slice();
  session.correct = 0;
  session.answered = 0;
  session.finished = 0;
  session.busy = false;
  render();
}

/* ===================== Rendering ===================== */
const main = document.getElementById("main");

function renderChrome() {
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.mode === session.mode ? "true" : "false"));
  const from = showSwedish() ? "Svenska" : "English";
  const to = showSwedish() ? "English" : "Svenska";
  document.getElementById("dirBtn").innerHTML =
    `<span>${from}</span><span class="arrow">→</span><span>${to}</span>`;
  const weakN = weakWords().length;
  const weakBtn = document.getElementById("weakBtn");
  weakBtn.textContent = weakN ? `Practice my weak words (${weakN})` : "No weak words yet";
  weakBtn.disabled = weakN === 0;
  updateScore();
}

function updateScore() {
  const scoreEl = document.getElementById("score");
  scoreEl.innerHTML = "";
  scoreEl.append(document.createTextNode(`Score ${session.correct}`));
  scoreEl.append(el("small", null, ` / ${session.answered}`));
  if (session.source === "weak") scoreEl.append(el("span", "session-tag", "Weak words"));
  const total = session.words.length || 1;
  document.getElementById("count").textContent = `${session.finished} of ${session.words.length} done`;
  document.getElementById("barFill").style.width = (session.finished / total * 100) + "%";
}

function render() {
  renderChrome();
  main.innerHTML = "";
  if (session.words.length === 0) { renderEmpty(); return; }
  if (session.queue.length === 0) { renderDone(); return; }
  if (session.mode === "swipe") renderSwipe();
  else if (session.mode === "choice") renderChoice();
  else renderType();
}

function renderEmpty() {
  const box = el("div", "done");
  box.append(el("div", "big", "🎉"));
  box.append(el("p", null, "No weak words right now. Great job!"));
  const b = el("button", "btn primary", "Study all words");
  b.onclick = () => startSession("all");
  box.append(b);
  main.append(box);
}

function renderDone() {
  const pct = session.answered ? Math.round(session.correct / session.answered * 100) : 0;
  const box = el("div", "done");
  box.append(el("div", "lang", "Bra jobbat! · Well done!"));
  box.append(el("div", "big", pct + "%"));
  box.append(el("p", null, `You got ${session.correct} of ${session.answered} answers right.`));
  const row = el("div", "row");
  const again = el("button", "btn primary", "New session");
  again.onclick = () => startSession("all");
  const weak = el("button", "btn", "Weak words");
  weak.disabled = weakWords().length === 0;
  weak.onclick = () => startSession("weak");
  row.append(again, weak);
  box.append(row);
  main.append(box);
}

/* ---------- 1. Swipe cards ---------- */
function renderSwipe() {
  const w = session.queue[0];
  const stage = el("div", "stage");
  if (session.queue.length > 1) stage.append(el("div", "peek"));

  const card = el("div", "card");
  const inner = el("div", "card-inner");

  const front = el("div", "face front");
  front.append(el("div", "lang", promptLang()));
  front.append(el("div", "word", promptOf(w)));
  front.append(el("div", "hint", "Tap to flip · swipe right if you knew it, left if not"));

  const back = el("div", "face back");
  back.append(el("div", "lang", answerLang()));
  back.append(el("div", "answer", answerOf(w)));
  back.append(el("div", "answer-sub", promptOf(w)));
  const ex = el("div", "example");
  ex.append(el("div", "sv", w.exSv));
  ex.append(el("div", "en", w.exEn));
  back.append(ex);

  inner.append(front, back);
  const tintGood = el("div", "tint good", "Knew it ✓");
  const tintBad = el("div", "tint bad", "✗ Didn't know");
  card.append(inner, tintGood, tintBad);
  stage.append(card);
  main.append(stage);

  const row = el("div", "row");
  const badBtn = el("button", "btn bad", "✗ Didn't know");
  const goodBtn = el("button", "btn good", "Knew it ✓");
  badBtn.onclick = () => flyOut(false);
  goodBtn.onclick = () => flyOut(true);
  row.append(badBtn, goodBtn);
  main.append(row);

  // --- touch / mouse dragging ---
  let startX = 0, startY = 0, dx = 0, dragging = false, moved = false, pointerId = null;
  const THRESHOLD = 100;

  function setDrag(x) {
    const rot = x / 18;
    card.style.transform = `translateX(${x}px) rotate(${rot}deg)`;
    const strength = Math.min(Math.abs(x) / THRESHOLD, 1);
    tintGood.style.opacity = x > 0 ? strength : 0;
    tintBad.style.opacity = x < 0 ? strength : 0;
  }

  card.addEventListener("pointerdown", e => {
    if (session.busy) return;
    dragging = true; moved = false; dx = 0;
    startX = e.clientX; startY = e.clientY; pointerId = e.pointerId;
    card.classList.remove("animate");
    try { card.setPointerCapture(pointerId); } catch (_) {}
  });
  card.addEventListener("pointermove", e => {
    if (!dragging || e.pointerId !== pointerId) return;
    dx = e.clientX - startX;
    if (Math.abs(dx) > 8 || Math.abs(e.clientY - startY) > 8) moved = true;
    if (moved) setDrag(dx);
  });
  function endDrag(e) {
    if (!dragging || (e && e.pointerId !== pointerId)) return;
    dragging = false;
    if (!moved) { card.classList.toggle("flipped"); return; }
    if (Math.abs(dx) > THRESHOLD) { flyOut(dx > 0); return; }
    card.classList.add("animate");
    setDrag(0);
  }
  card.addEventListener("pointerup", endDrag);
  card.addEventListener("pointercancel", endDrag);

  function flyOut(knew) {
    if (session.busy) return;
    session.busy = true;
    card.classList.add("animate");
    const dir = knew ? 1 : -1;
    tintGood.style.opacity = knew ? 1 : 0;
    tintBad.style.opacity = knew ? 0 : 1;
    card.style.transform = `translateX(${dir * window.innerWidth * 1.1}px) rotate(${dir * 24}deg)`;
    setTimeout(() => {
      session.busy = false;
      answerSwipe(knew);
    }, 300);
  }
}

function answerSwipe(knew) {
  const w = session.queue.shift();
  session.answered++;
  markResult(w, knew);
  if (knew) {
    session.correct++;
    session.finished++;
  } else {
    // Put the card back a few places later so it comes back in this session.
    const pos = Math.min(session.queue.length, 3 + Math.floor(Math.random() * 3));
    session.queue.splice(pos, 0, w);
  }
  render();
}

/* ---------- 2. Multiple choice ---------- */
function renderChoice() {
  const w = session.queue[0];
  const box = el("div", "prompt-card");
  box.append(el("div", "lang", promptLang()));
  box.append(el("div", "word", promptOf(w)));
  main.append(box);

  const right = answerOf(w);
  const others = shuffle(WORDS.filter(x => x !== w && normalize(answerOf(x)) !== normalize(right)));
  const picks = [];
  for (const o of others) {
    if (picks.length === 3) break;
    if (!picks.some(p => normalize(answerOf(p)) === normalize(answerOf(o)))) picks.push(o);
  }
  const choices = shuffle([w, ...picks]);

  const grid = el("div", "options");
  const buttons = choices.map(c => {
    const b = el("button", "option", answerOf(c));
    b.onclick = () => {
      if (session.busy) return;
      session.busy = true;
      const ok = c === w;
      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (choices[i] === w) btn.classList.add("correct");
      });
      if (!ok) b.classList.add("wrong");
      session.answered++;
      if (ok) session.correct++;
      session.finished++;
      markResult(w, ok);
      updateScore();
      fb.className = "feedback " + (ok ? "good" : "bad");
      fb.textContent = ok ? "Rätt! Correct ✓" : `Not quite — it's “${right}”`;
      const ex = el("span", "ex", `${w.exSv} — ${w.exEn}`);
      fb.append(ex);
      setTimeout(() => {
        session.queue.shift();
        session.busy = false;
        render();
      }, ok ? 1200 : 2200);
    };
    grid.append(b);
    return b;
  });
  main.append(grid);
  const fb = el("div", "feedback");
  fb.style.marginTop = "16px";
  main.append(fb);
}

/* ---------- 3. Typing ---------- */
function renderType() {
  const w = session.queue[0];
  const box = el("div", "prompt-card");
  box.append(el("div", "lang", promptLang()));
  box.append(el("div", "word", promptOf(w)));
  box.append(el("div", "answer-sub", showSwedish() ? "Type the English meaning" : "Type the Swedish word"));
  main.append(box);

  const input = el("input", "type-input");
  input.type = "text";
  input.setAttribute("autocomplete", "off");
  input.setAttribute("autocorrect", "off");
  input.setAttribute("autocapitalize", "off");
  input.setAttribute("spellcheck", "false");
  input.setAttribute("enterkeyhint", "go");
  input.placeholder = showSwedish() ? "English…" : "Svenska…";
  main.append(input);

  const letters = el("div", "letters");
  ["å", "ä", "ö"].forEach(ch => {
    const b = el("button", "letter", ch);
    b.type = "button";
    // Stop the button from stealing focus, so the iPad keyboard stays open.
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.addEventListener("mousedown", e => e.preventDefault());
    b.addEventListener("click", () => insertAtCursor(input, ch));
    letters.append(b);
  });
  main.append(letters);

  const fb = el("div", "feedback");
  main.append(fb);
  const action = el("button", "btn primary", "Check");
  action.style.width = "100%";
  main.append(action);

  let checked = false;
  function check() {
    if (checked) { next(); return; }
    if (!input.value.trim()) { input.focus(); return; }
    checked = true;
    const ok = alternatives(answerOf(w)).includes(normalize(input.value)) ||
               normalize(answerOf(w)) === normalize(input.value);
    session.answered++;
    if (ok) session.correct++;
    session.finished++;
    markResult(w, ok);
    updateScore();
    input.classList.add(ok ? "correct" : "wrong");
    input.readOnly = true;
    fb.className = "feedback " + (ok ? "good" : "bad");
    fb.textContent = ok ? "Rätt! Correct ✓" : `The answer is “${answerOf(w)}”`;
    fb.append(el("span", "ex", `${w.exSv} — ${w.exEn}`));
    action.textContent = "Next →";
  }
  function next() {
    session.queue.shift();
    render();
    const nextInput = main.querySelector(".type-input");
    if (nextInput) nextInput.focus();
  }
  action.onclick = check;
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });
}

function insertAtCursor(input, text) {
  if (input.readOnly) return;
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;
  input.value = input.value.slice(0, start) + text + input.value.slice(end);
  const pos = start + text.length;
  input.focus();
  try { input.setSelectionRange(pos, pos); } catch (_) {}
}

/* ===================== Buttons ===================== */
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  if (session.mode === t.dataset.mode) return;
  session.mode = t.dataset.mode;
  store.mode = session.mode;
  saveData();
  startSession(session.source === "weak" && weakWords().length ? "weak" : "all");
}));
document.getElementById("dirBtn").addEventListener("click", () => {
  store.reverse = !store.reverse;
  saveData();
  startSession(session.source === "weak" && weakWords().length ? "weak" : "all");
});
document.getElementById("newBtn").addEventListener("click", () => startSession("all"));
document.getElementById("weakBtn").addEventListener("click", () => startSession("weak"));
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Reset all progress? Your list of weak words will be cleared.")) return;
  store.wrong = {};
  saveData();
  startSession("all");
});

/* ===================== Home Screen icon ===================== */
// iPad needs a PNG picture for the Home Screen, so we draw one here.
(function makeTouchIcon() {
  try {
    const c = document.createElement("canvas");
    c.width = c.height = 180;
    const g = c.getContext("2d");
    g.fillStyle = "#1f4e79";
    g.fillRect(0, 0, 180, 180);
    g.fillStyle = "#f2c94c";
    g.fillRect(0, 74, 180, 32);   // Swedish-flag style cross
    g.fillRect(52, 0, 32, 180);
    g.fillStyle = "#ffffff";
    g.font = "bold 64px -apple-system, Helvetica, Arial, sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.shadowColor = "rgba(0,0,0,.35)";
    g.shadowBlur = 8;
    g.fillText("Sv", 118, 132);
    document.getElementById("touchIcon").href = c.toDataURL("image/png");
  } catch (e) { /* ignore */ }
})();

startSession("all");
</script>
</body>
